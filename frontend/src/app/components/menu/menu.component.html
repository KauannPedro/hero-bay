<header class="topo">
  <div class="container topo-conteudo">
    @if (usuarioLogado() === 'admin') {
      <span class="logo"><img src="images/logo-hero-bay.png" alt="Hero Bay">Hero Bay</span>
      <div class="acoes">
        <span class="fraco">Administrador</span>
        <button class="sair" (click)="sair()">Sair</button>
      </div>
    } @else {
      <a class="logo" routerLink="/"><img src="images/logo-hero-bay.png" alt="Hero Bay">Hero Bay</a>

      <nav class="navegacao">
        @for (item of itensMenu; track item) {
          <a [routerLink]="item.link">{{ item.label }}</a>
        }
      </nav>

      <div class="acoes">
        @if (usuarioLogado() === '') {
          <a routerLink="/login">Entrar</a>
        } @else {
          <span class="fraco">Olá, {{ usuarioLogado() }}</span>
          <button class="sair" (click)="sair()">Sair</button>
        }
        <a routerLink="/carrinho"><b>Carrinho</b> ({{ itensNoCarrinho() }})</a>
      </div>
    }
  </div>
</header>
