<main class="container pagina">
  <h1 class="titulo">Fale com a gente.</h1>

  <div class="duas-colunas conteudo">
    <section class="coluna">
      <div class="info"><span>WhatsApp</span><strong>(11) 99999-8888</strong></div>
      <div class="info"><span>E-mail</span><strong>suporte&#64;herobay.com.br</strong></div>
      <div class="info"><span>Loja</span><strong>Av. Eng. Eusébio Stevaux, 823 · São Paulo</strong></div>
      <div class="info"><span>Horário</span><strong>Seg. a sex., 8h às 18h · sáb., 9h às 13h</strong></div>
      <div class="info"><span>Instagram</span><a href="https://instagram.com/herobay" target="_blank">&#64;herobay</a></div>
    </section>

    <section class="coluna">
      @if (mensagemEnviada) {
        <div class="enviado">
          <h2>Mensagem enviada.</h2>
          <p>Vamos responder em <span class="mono">{{ email }}</span> em até 1 dia útil.</p>
          <button class="link" (click)="novaMensagem()">Enviar outra mensagem</button>
        </div>
      } @else {
        <form>
          <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" [(ngModel)]="nome" (keyup)="validarFormulario()">
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" [(ngModel)]="email" (keyup)="validarFormulario()">
          </div>
          <div class="campo">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" [(ngModel)]="mensagem" (keyup)="validarFormulario()"></textarea>
          </div>
          <button class="botao" type="submit" [disabled]="botaoDesabilitado" (click)="enviarMensagem()">Enviar mensagem</button>
        </form>
      }
    </section>
  </div>
</main>
