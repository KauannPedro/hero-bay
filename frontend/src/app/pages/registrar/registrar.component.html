<main class="container pagina duas-colunas">
  <div class="coluna">
    <h1 class="titulo">Criar conta.</h1>
    <p class="texto-apoio">Leva menos de um minuto.</p>
  </div>

  <form class="formulario">
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" [(ngModel)]="nome" (keyup)="validarFormulario()">
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" [(ngModel)]="login" (keyup)="validarFormulario()">
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" [(ngModel)]="senha" (keyup)="validarFormulario()">
    </div>

    @if (mensagemErro !== '') {
      <p class="erro">{{ mensagemErro }}</p>
    }

    <button class="botao" type="submit" [disabled]="botaoDesabilitado" (click)="fazerCadastro()">Criar conta</button>

    <p class="depois">Já tem conta? <a class="link" routerLink="/login">Entrar</a></p>
  </form>
</main>
