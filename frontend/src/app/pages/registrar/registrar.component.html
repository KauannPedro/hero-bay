<div class="content-container">
  <form class="login-card">
    <h2>Registre-se</h2>

    <div class="form-group">
      <label for="email">Email</label>
      <input class="input-simples" id="email" name="email" type="email" placeholder="Digite seu email"
        (keyup)="validarFormulario()" [(ngModel)]="login" />
    </div>

    <div class="form-group">
      <label for="input-name">Nome Completo</label>
      <input class="input-simples" id="input-senha" name="input-senha" type="text" placeholder="Digite sua senha"
        (keyup)="validarFormulario()" [(ngModel)]="nome" />
    </div>
    
    <div class="form-group">
      <label for="input-senha">Senha</label>
      <input class="input-simples" id="input-senha" name="input-senha" type="password" placeholder="Digite sua senha"
        (keyup)="validarFormulario()" [(ngModel)]="senha" />
    </div>
    

    <button class="input-submeter" [disabled]="botaoDesabilitado" (click)="fazerCadastro()">
      Confirmar
    </button>
    <div class="inputs-row">
      <button routerLink="/" class="input-submeter-low">
        Voltar
      </button>

      <button routerLink="/login" class="input-submeter-low">
        Login
      </button>
    </div>
  </form>
</div>
