<main class="container pagina duas-colunas">
  <div class="coluna">
    <h1 class="titulo">Entrar.</h1>
    <p class="texto-apoio">Acompanhe o carrinho e compre mais rápido.</p>
  </div>

  <form class="formulario">
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" [(ngModel)]="login" (keyup)="validarFormulario()">
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" [(ngModel)]="senha" (keyup)="validarFormulario()">
    </div>

    @if (mensagemErro !== '') {
      <p class="erro">{{ mensagemErro }}</p>
    }

    <button class="botao" type="submit" [disabled]="botaoDesabilitado" (click)="fazerLogin()">Entrar</button>

    <p class="depois">Ainda não tem conta? <a class="link" routerLink="/registrar">Criar conta</a></p>
  </form>
</main>
